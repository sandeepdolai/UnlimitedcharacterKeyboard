name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify and extract Android Studio project
        shell: bash
        run: |
          echo "1429f2b93384e67b83f92eee398740b00c7f1144079050f6a657fa3aea917945  PasteboardKeyboard-AndroidStudio.zip" | sha256sum --check
          unzip -q PasteboardKeyboard-AndroidStudio.zip -d .

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Assemble debug APK
        working-directory: PasteboardKeyboard
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PasteboardKeyboard-debug-apk
          path: PasteboardKeyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
